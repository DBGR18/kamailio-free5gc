# free5gc + Kamailio PoC
#
# Two Docker networks on purpose:
#
#   corenet 10.100.200.0/24  the 5G core itself: SBI between NFs, N2 (gNB<->AMF),
#                            N3 (gNB<->UPF, GTP-U), N4 (SMF<->UPF, PFCP)
#   dnnet   10.100.100.0/24  the Data Network reached over N6. Kamailio lives
#                            here, exactly where an IMS would sit.
#
# The UPF is the only NF attached to both -- it is the gateway between the
# 5G user plane and the outside world, which is the whole point.

services:

  # ---------------------------------------------------------------- data plane
  upf:
    container_name: poc-upf
    image: free5gc/upf:v4.2.3
    command: bash -c "./upf-n6.sh && ./upf -c ./config/upfcfg.yaml"
    volumes:
      - ./config/upfcfg.yaml:/free5gc/config/upfcfg.yaml
      - ./config/upf-n6.sh:/free5gc/upf-n6.sh
    cap_add:
      - NET_ADMIN
    networks:
      corenet:
        ipv4_address: 10.100.200.30
      dnnet:
        ipv4_address: 10.100.100.30

  # ------------------------------------------------------------ IMS: P-CSCF
  # The AF shim, the P-CSCF's arm into the 5G policy plane. It is the only
  # container on both networks, and it has to be: the P-CSCF that calls it
  # lives on the data network, while the PCF it calls lives on the core's SBI
  # network. That is the AF's actual position -- an IMS-facing service that is
  # inside the 5GC trust domain.
  af:
    container_name: poc-af
    image: poc/af:latest
    build: ./af
    environment:
      PCF_URI: http://pcf:8000
      # The PCF only ever sees this container on the core network, so the
      # address it is told to call back on has to be the corenet one.
      AF_NOTIF_URI: http://10.100.200.50:8090/notify
      AF_DNN: ims
      NRF_URI: http://nrf.free5gc.org:8000
      AF_CORENET_IP: 10.100.200.50
    networks:
      corenet:
        ipv4_address: 10.100.200.50
      dnnet:
        ipv4_address: 10.100.100.40
    depends_on:
      - pcf

  pcscf:
    container_name: poc-pcscf
    image: poc/pcscf:latest
    build: ./pcscf
    volumes:
      - ./pcscf/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
    environment:
      UPF_DN_IP: 10.100.100.30
      UE_SUBNET: 10.62.0.0/16
    cap_add:
      - NET_ADMIN
    networks:
      dnnet:
        ipv4_address: 10.100.100.10
    depends_on:
      - upf

  # ------------------------------------------------------------ control plane
  db:
    container_name: poc-mongodb
    image: mongo:4.4
    command: mongod --port 27017
    expose:
      - "27017"
    volumes:
      - dbdata:/data/db
    networks:
      corenet:
        aliases:
          - db

  nrf:
    container_name: poc-nrf
    image: free5gc/nrf:v4.2.3
    command: ./nrf -c ./config/nrfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/nrfcfg.yaml:/free5gc/config/nrfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      corenet:
        aliases:
          - nrf.free5gc.org
    depends_on:
      - db

  amf:
    container_name: poc-amf
    image: free5gc/amf:v4.2.3
    command: ./amf -c ./config/amfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/amfcfg.yaml:/free5gc/config/amfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      corenet:
        ipv4_address: 10.100.200.16
        aliases:
          - amf.free5gc.org
    depends_on:
      - nrf

  ausf:
    container_name: poc-ausf
    image: free5gc/ausf:v4.2.3
    command: ./ausf -c ./config/ausfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/ausfcfg.yaml:/free5gc/config/ausfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      corenet:
        aliases:
          - ausf.free5gc.org
    depends_on:
      - nrf

  nssf:
    container_name: poc-nssf
    image: free5gc/nssf:v4.2.3
    command: ./nssf -c ./config/nssfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/nssfcfg.yaml:/free5gc/config/nssfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      corenet:
        aliases:
          - nssf.free5gc.org
    depends_on:
      - nrf

  pcf:
    container_name: poc-pcf
    image: free5gc/pcf:v4.2.3
    command: ./pcf -c ./config/pcfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/pcfcfg.yaml:/free5gc/config/pcfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      corenet:
        aliases:
          - pcf.free5gc.org
    depends_on:
      - nrf

  smf:
    container_name: poc-smf
    image: free5gc/smf:v4.2.3
    command: ./smf -c ./config/smfcfg.yaml -u ./config/uerouting.yaml
    expose:
      - "8000"
    volumes:
      - ./config/smfcfg.yaml:/free5gc/config/smfcfg.yaml
      - ./config/uerouting.yaml:/free5gc/config/uerouting.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      corenet:
        aliases:
          - smf.free5gc.org
    depends_on:
      - nrf
      - upf

  udm:
    container_name: poc-udm
    image: free5gc/udm:v4.2.3
    command: ./udm -c ./config/udmcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/udmcfg.yaml:/free5gc/config/udmcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      corenet:
        aliases:
          - udm.free5gc.org
    depends_on:
      - db
      - nrf

  udr:
    container_name: poc-udr
    image: free5gc/udr:v4.2.3
    command: ./udr -c ./config/udrcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/udrcfg.yaml:/free5gc/config/udrcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      corenet:
        aliases:
          - udr.free5gc.org
    depends_on:
      - db
      - nrf


  # ------------------------------------------------- provisioning front-end
  # 02-add-subscribers.sh talks to this container's REST API on port 5000.
  webui:
    container_name: poc-webui
    image: free5gc/webui:v4.2.3
    command: ./webui -c ./config/webuicfg.yaml
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./config/webuicfg.yaml:/free5gc/config/webuicfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      corenet:
        aliases:
          - webui.free5gc.org
    depends_on:
      - db
      - nrf


  # ------------------------------------------------------------- RAN and UEs
  # free-ran-ue does GTP-U in user space, so unlike the UPF these containers
  # need no gtp5g -- only NET_ADMIN, to bring up their own TUN device.
  gnb:
    container_name: poc-gnb
    image: poc/ran:latest
    build: ./ran
    entrypoint: ["/entrypoint-gnb.sh"]
    volumes:
      - ./config/gnb.yaml:/ran/config/gnb.yaml:ro
    cap_add:
      - NET_ADMIN
    networks:
      corenet:
        ipv4_address: 10.100.200.40
        aliases:
          - gnb.free5gc.org
    depends_on:
      - amf
      - upf

  ue1:
    container_name: poc-ue1
    image: poc/ran:latest
    build: ./ran
    entrypoint: ["/entrypoint-ue.sh"]
    volumes:
      - ./config/ue-ue1.yaml:/ran/config/ue.yaml:ro
      # Mounted rather than baked in, so a scenario change only needs a
      # container restart instead of rebuilding the whole RAN image.
      - ./ran/sipp:/sipp:ro
    environment:
      IMS_SUBNET: 10.100.100.0/24
      UE_SUBNET: 10.62.0.0/16
      TUN_PREFIX: ueTun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    networks:
      corenet:
        ipv4_address: 10.100.200.41
    depends_on:
      - gnb

  ue2:
    container_name: poc-ue2
    image: poc/ran:latest
    build: ./ran
    entrypoint: ["/entrypoint-ue.sh"]
    volumes:
      - ./config/ue-ue2.yaml:/ran/config/ue.yaml:ro
      # Mounted rather than baked in, so a scenario change only needs a
      # container restart instead of rebuilding the whole RAN image.
      - ./ran/sipp:/sipp:ro
    environment:
      IMS_SUBNET: 10.100.100.0/24
      UE_SUBNET: 10.62.0.0/16
      TUN_PREFIX: ueTun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    networks:
      corenet:
        ipv4_address: 10.100.200.42
    depends_on:
      - gnb


  # --------------------------------------------------------------- IMS: HSS
  # PyHSS. Three roles out of one image plus Redis; the database is SQLite on
  # a shared volume, so there is no database container. Everything lives on
  # the Data Network side with Kamailio -- the HSS has no interface to the 5G
  # core, so the UPF stays the only bridge between the two networks.
  pyhss-redis:
    container_name: poc-pyhss-redis
    image: redis:7.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pyhss-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      dnnet:
        aliases:
          - pyhss-redis

  # The subscriber logic and the SQLite store.
  pyhss-hss:
    container_name: poc-pyhss-hss
    image: ghcr.io/nickvsnetworking/pyhss/pyhss:latest@sha256:da53ca7085e907d4307162c9bdbe9b9972b5d0ecac84afeb8bdd1195bd95dad0
    env_file: ./hss/pyhss.env
    environment:
      CONTAINER_ROLE: hss
    volumes:
      - pyhss-db:/var/lib/pyhss
    networks:
      - dnnet
    depends_on:
      pyhss-redis:
        condition: service_healthy

  # The provisioning REST API. 04-add-ims-subscribers.sh talks to this.
  pyhss-api:
    container_name: poc-pyhss-api
    image: ghcr.io/nickvsnetworking/pyhss/pyhss:latest@sha256:da53ca7085e907d4307162c9bdbe9b9972b5d0ecac84afeb8bdd1195bd95dad0
    env_file: ./hss/pyhss.env
    environment:
      CONTAINER_ROLE: api
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - pyhss-db:/var/lib/pyhss
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/oam/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - dnnet
    depends_on:
      - pyhss-hss

  # The Cx endpoint: this is what the I-CSCF and S-CSCF will connect to.
  pyhss-diameter:
    container_name: poc-pyhss-diameter
    image: ghcr.io/nickvsnetworking/pyhss/pyhss:latest@sha256:da53ca7085e907d4307162c9bdbe9b9972b5d0ecac84afeb8bdd1195bd95dad0
    env_file: ./hss/pyhss.env
    environment:
      CONTAINER_ROLE: diameter
    volumes:
      - pyhss-db:/var/lib/pyhss
    networks:
      dnnet:
        ipv4_address: 10.100.100.20
        aliases:
          - hss.ims.mnc093.mcc208.3gppnetwork.org
    depends_on:
      pyhss-api:
        condition: service_healthy


  # ------------------------------------------------------------ IMS: S-CSCF
  # The first CSCF role split out of the single proxy. It is the only one
  # that talks to the HSS, so splitting it first puts the Cx interface built
  # in the previous step to work immediately.
  scscf:
    container_name: poc-scscf
    image: poc/scscf:latest
    build: ./scscf
    environment:
      UE_SUBNET: 10.62.0.0/16
      UPF_DN_IP: 10.100.100.30
    volumes:
      - ./scscf/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./scscf/scscf.xml:/etc/kamailio/scscf.xml:ro
      - ./scscf/CxDataType_Rel7.xsd:/etc/kamailio/CxDataType_Rel7.xsd:ro
    cap_add:
      - NET_ADMIN
    networks:
      dnnet:
        ipv4_address: 10.100.100.21
        aliases:
          - scscf.ims.mnc093.mcc208.3gppnetwork.org
    depends_on:
      - pyhss-diameter


  # ------------------------------------------------------------ IMS: I-CSCF
  # The network's front door. It holds no user state -- it asks the HSS which
  # S-CSCF serves a user (UAR) and where a callee is registered (LIR), which
  # are the two Cx commands the S-CSCF never sends.
  icscf:
    container_name: poc-icscf
    image: poc/icscf:latest
    build: ./icscf
    environment:
      UE_SUBNET: 10.62.0.0/16
      UPF_DN_IP: 10.100.100.30
    volumes:
      - ./icscf/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./icscf/icscf.xml:/etc/kamailio/icscf.xml:ro
    cap_add:
      - NET_ADMIN
    networks:
      dnnet:
        ipv4_address: 10.100.100.22
        aliases:
          - icscf.ims.mnc093.mcc208.3gppnetwork.org
    depends_on:
      - pyhss-diameter
      - scscf


networks:
  corenet:
    name: poc-corenet
    ipam:
      driver: default
      config:
        - subnet: 10.100.200.0/24
    driver_opts:
      com.docker.network.bridge.name: br-poc-core
  dnnet:
    name: poc-dnnet
    ipam:
      driver: default
      config:
        - subnet: 10.100.100.0/24
    driver_opts:
      com.docker.network.bridge.name: br-poc-dn

volumes:
  dbdata:
  pyhss-db:
  pyhss-redis:
