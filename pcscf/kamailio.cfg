#!KAMAILIO
#
# P-CSCF -- the Proxy CSCF.
#
# The UE's only contact point, and the only IMS node that faces the access
# network. Everything the UE sends arrives here first, and everything the IMS
# sends back leaves from here.
#
# It is deliberately the dumbest of the three roles. It holds no subscriber
# data and never talks to the HSS -- it records which UE is registered where
# (ims_usrloc_pcscf, populated by watching registration succeed) and forwards
# everything else to the I-CSCF, which is the node that knows how to ask.
#
# Position in the topology: this container sits on the Data Network, so every
# SIP message it sees has travelled UE -> gNB -> (GTP-U/N3) -> UPF -> (N6).
# Nothing about that changed when the roles were split.

####### Defined Values #########
#!define DN_IP     "10.100.100.10"
#!define PCSCF_URI "sip:pcscf.ims.mnc093.mcc208.3gppnetwork.org:5060"
#!define ICSCF_URI "sip:10.100.100.22:4060"
#!define UE_POOL   "10.62.0.0/16"
#!define AF_URL    "http://10.100.100.40:8090"

####### Global Parameters #########
debug=2
log_stderror=yes
log_facility=LOG_LOCAL0

children=4
listen=udp:DN_IP:5060
disable_tcp=yes

####### Modules #########
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "path.so"

# Reading the negotiated SDP, and reaching the AF shim with it.
loadmodule "sdpops.so"
loadmodule "http_client.so"

# ims_usrloc_pcscf binds ims_dialog at startup, the same dependency the
# S-CSCF's usrloc has.
loadmodule "ims_dialog.so"
loadmodule "ims_usrloc_pcscf.so"
loadmodule "ims_registrar_pcscf.so"

####### Module parameters #########
modparam("ims_dialog", "dlg_flag", 4)

# http_client_query() blocks the worker that calls it, so this timeout is the
# worst case a call setup can be delayed by an unreachable AF. Four children
# and one reservation per call leg make that acceptable here; a real P-CSCF
# would use http_async_client and a callback route instead.
modparam("http_client", "connection_timeout", 2)

modparam("ims_usrloc_pcscf", "db_mode", 0)

modparam("ims_registrar_pcscf", "pcscf_uri", PCSCF_URI)
# The UE's contact is behind the UPF, so its source port will not match what
# it advertises. Checking that would reject every registration here.
modparam("ims_registrar_pcscf", "ignore_contact_rxport_check", 1)
modparam("ims_registrar_pcscf", "is_registered_fallback2ip", 1)
modparam("ims_registrar_pcscf", "pending_reg_expires", 30)
# No reg-event subscription: that needs a dialog and a SUBSCRIBE path that
# this PoC does not have yet.
modparam("ims_registrar_pcscf", "subscribe_to_reginfo", 0)
modparam("ims_registrar_pcscf", "publish_reginfo", 0)

####### Routing Logic #########

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "[PCSCF] malformed request from $si:$sp\n");
        exit;
    }

    xlog("L_INFO", "[PCSCF] $rm from $si:$sp -> $ru\n");

    if (has_totag()) {
        if (is_method("BYE")) {
            route(AF_RELEASE);
        }
        if (loose_route()) {
            route(RELAY);
        } else if (is_method("ACK")) {
            exit;
        } else {
            sl_send_reply("404", "Not Here");
        }
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }
    t_check_trans();

    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    # Gm side or Mw side? A real P-CSCF has one interface facing the access
    # network and another facing the core, and tells the two directions apart
    # by which one a request arrived on. Here they share a link, so the source
    # address stands in for that: anything from the UE pool came up a PDU
    # session, anything else came from the core.
    #
    # The return value of loose_route() cannot be used for this, which is not
    # obvious. On a terminating request the only Route is the Path this proxy
    # inserted at registration; kamailio strips it and then returns
    # NOT_RR_DRIVEN -- false -- because with the Route gone there is nothing
    # left to route by except the R-URI. Testing that return value therefore
    # sends every terminating INVITE down the originating branch and back to
    # the I-CSCF, which returns it to the S-CSCF, which sends it here again.
    if (src_ip != UE_POOL) {
        # Consume the Path-derived Route. The R-URI is already the contact
        # the callee registered, so nothing else has to be resolved.
        loose_route();
        if (is_method("INVITE")) {
            record_route();
            # On this leg the UE we serve is the one the request is going to,
            # and the SDP offer in front of us belongs to the far end.
            $avp(af_dir) = "term";
            $avp(af_ue_addr) = $rd;
            $avp(af_supi) = "imsi-" + $tU;
            route(AF_READ_OFFER);
            t_on_reply("INVITE_REPLY");
        }
        xlog("L_INFO", "[PCSCF] terminating $rm -> $ru\n");
        route(RELAY);
        exit;
    }

    # From a UE: send it to the I-CSCF, which asks the HSS where the callee
    # lives. The P-CSCF cannot answer that itself.
    if (is_method("INVITE")) {
        record_route();
        # Here the UE we serve is the sender, so the offer is its own.
        $avp(af_dir) = "orig";
        $avp(af_ue_addr) = $si;
        $avp(af_supi) = "imsi-" + $fU;
        route(AF_READ_OFFER);
        t_on_reply("INVITE_REPLY");
    }
    $du = ICSCF_URI;
    xlog("L_INFO", "[PCSCF] originating $rm -> the I-CSCF\n");
    route(RELAY);
}

# --- REGISTER: add a Path and forward; record the binding once it works ---
route[REGISTER] {
    # The Path header is how the S-CSCF learns to route later requests back
    # through this P-CSCF. Without it the terminating call would be sent
    # straight at the UE address and bypass us.
    add_path_received();

    # The I-CSCF puts this into the UAR's Visited-Network-Identifier, which
    # is how the HSS applies roaming policy. It refuses the REGISTER with
    # 400 if the header is absent, so the P-CSCF has to add it -- there is
    # no default.
    append_hf("P-Visited-Network-ID: ims.mnc093.mcc208.3gppnetwork.org\r\n");

    $du = ICSCF_URI;
    xlog("L_INFO", "[PCSCF] REGISTER for $tu -> I-CSCF\n");
    t_on_reply("REGISTER_REPLY");
    route(RELAY);
}

onreply_route[REGISTER_REPLY] {
    # Only a 200 means the S-CSCF accepted the registration -- a 401 is the
    # AKA challenge on its way back to the UE and must not be recorded.
    if (t_check_status("200")) {
        if (pcscf_save("location")) {
            xlog("L_INFO", "[PCSCF] registered $tu\n");
        } else {
            xlog("L_ERR", "[PCSCF] could not record the binding for $tu\n");
        }
    }
    break;
}

# =====================================================================
#  Acting as an Application Function
# =====================================================================
#
# Reading the SDP is the P-CSCF's own job -- it is the node that sees both
# halves of the offer/answer for the access leg it serves, which is exactly
# what the policy function needs in order to authorise the media flow. What
# it cannot do here is deliver that to free5gc: the PCF offers
# Npcf_PolicyAuthorization over HTTP/2 cleartext and http_client is libcurl,
# which will not speak h2c with prior knowledge. Hence the shim at AF_URL.
#
# The reservation is made on the 200 OK, because that is the first moment
# both ports are known. A real IMS would do it earlier, at the 183 with
# preconditions, and hold the call until the network confirms -- there is no
# PRACK or precondition handling here.
#
# Both call legs pass through this proxy, and each makes its own reservation:
# a leg's UE has its own PDU session, so it needs its own QoS flow. The two
# are told apart by $avp(af_dir) and keyed on Call-ID plus the UE address,
# because the Call-ID alone is the same on both.

# --- Remember the offer while the request is still in front of us ---
route[AF_READ_OFFER] {
    $avp(af_offer) = $null;
    if (!has_body("application/sdp")) {
        return;
    }
    # Kept whole and base64'd rather than picked apart here. The config
    # language has no extraction primitive that works across SDP lines --
    # re.subst is POSIX, so its "." stops at a newline, and a failed match
    # returns the subject unchanged, which reads as a successful extraction
    # of the entire body. Base64 also means a body full of CRLFs can sit in
    # a JSON string with no escaping to get wrong.
    $avp(af_offer) = $(rb{s.encode.base64});
}

# --- On the answer, both ends are known: ask for the reservation ---
onreply_route[INVITE_REPLY] {
    if (!t_check_status("200")) {
        break;
    }
    if ($avp(af_ue_addr) == $null || $avp(af_offer) == $null) {
        break;
    }
    if (!has_body("application/sdp")) {
        xlog("L_WARN", "[PCSCF] 200 OK carries no SDP; no QoS requested\n");
        break;
    }

    $var(answer) = $(rb{s.encode.base64});
    route(AF_RESERVE);
    break;
}

route[AF_RESERVE] {
    $var(af_ue) = $avp(af_ue_addr);
    route(AF_KEY);
    $var(body) = '{"callId":"' + $var(af_key) + '","supi":"' + $avp(af_supi) +
                 '","ueAddr":"' + $avp(af_ue_addr) + '","dir":"' + $avp(af_dir) +
                 '","offerSdp":"' + $avp(af_offer) + '","answerSdp":"' + $var(answer) + '"}';
    xlog("L_INFO", "[PCSCF] AF: reserving for $avp(af_ue_addr) ($avp(af_dir)) on $var(af_key)\n");

    if (http_client_query(AF_URL "/call", "$var(body)", "$var(afres)") < 0) {
        # A failed reservation must not fail the call. On a network that
        # enforced QoS this would be the point to decide otherwise.
        xlog("L_ERR", "[PCSCF] AF: reservation failed, call continues without QoS\n");
        return;
    }
    xlog("L_INFO", "[PCSCF] AF: reserved [$var(afres)]\n");
}

# --- BYE: give the reservation back ---
route[AF_RELEASE] {
    if (src_ip == UE_POOL) {
        $var(af_ue) = $si;
    } else {
        $var(af_ue) = $rd;
    }
    route(AF_KEY);
    $var(body) = '{"callId":"' + $var(af_key) + '"}';
    if (http_client_query(AF_URL "/call/delete", "$var(body)", "$var(afres)") < 0) {
        xlog("L_ERR", "[PCSCF] AF: could not release $var(af_key)\n");
        return;
    }
    xlog("L_INFO", "[PCSCF] AF: released $var(af_key)\n");
}

# --- The key both halves agree on ---
route[AF_KEY] {
    # Call-ID plus the UE address, because one call produces two reservations
    # through this proxy and they must not overwrite each other.
    #
    # The Call-ID is text a UE chose, and it is about to be pasted into JSON,
    # so anything outside the RFC 3261 callid charset is folded to "_" first.
    # That is lossless for a well-formed Call-ID and closes the injection.
    $var(af_key) = $(ci{re.subst,/[^A-Za-z0-9@._-]/_/g}) + "@" + $var(af_ue);
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

onreply_route {
    xlog("L_INFO", "[PCSCF] reply $rs for $rm from $si\n");
}
