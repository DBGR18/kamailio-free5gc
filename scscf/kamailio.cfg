#!KAMAILIO
#
# S-CSCF -- the Serving CSCF.
#
# This is where registration stops being "whoever asks, gets in". The old
# proxy called save("location") unconditionally; this one challenges the UE
# with IMS AKA, fetches the vectors from the HSS over Cx, and only then
# records the binding -- telling the HSS which S-CSCF is serving the user
# while it does so.
#
# Cx exchanges involved, in the order a registration triggers them:
#   MAR/MAA   ims_auth asks the HSS for authentication vectors
#   SAR/SAA   ims_registrar_scscf registers this S-CSCF as serving the user
#             and receives the user profile back
#
# The Diameter transport itself is cdp; see scscf.xml for the peer setup and
# for which three names have to match PyHSS exactly.

####### Defined Values #########
#!define SCSCF_IP   "10.100.100.21"
#!define SCSCF_PORT 6060
#!define SCSCF_URI  "sip:scscf.ims.mnc093.mcc208.3gppnetwork.org:6060"
#!define HSS_REALM  "ims.mnc093.mcc208.3gppnetwork.org"

####### Global Parameters #########
debug=2
log_stderror=yes
log_facility=LOG_LOCAL0

children=4
listen=udp:SCSCF_IP:SCSCF_PORT
disable_tcp=yes

####### Modules #########
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
# textopsx, only for remove_hf_value(): it deletes one header value
# rather than every header of that name, which matters below.
loadmodule "textopsx.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"

# The IMS side. cdp must load before anything that speaks Diameter.
loadmodule "cdp.so"
loadmodule "cdp_avp.so"
# ims_usrloc_scscf binds to both presence and ims_dialog at startup, so both
# have to be loaded before it even though this PoC uses neither directly.
# presence needs a database driver bound before its own mod_init runs.
loadmodule "db_sqlite.so"
loadmodule "presence.so"
loadmodule "ims_dialog.so"
loadmodule "ims_usrloc_scscf.so"
loadmodule "ims_registrar_scscf.so"
loadmodule "ims_auth.so"

####### Module parameters #########

# ----- cdp: the Diameter peer -----
modparam("cdp", "config_file", "/etc/kamailio/scscf.xml")

# ----- ims_dialog: only present because ims_usrloc_scscf binds to it -----
# It refuses to start without a dialog flag, so give it one. Nothing in this
# config sets the flag, so no dialog is ever actually tracked.
modparam("ims_dialog", "dlg_flag", 4)

# ----- presence: likewise only present as a dependency -----
# It needs a database; sqlite keeps that to a file inside the container
# instead of another service. No presence state is ever published.
# Four slashes: kamailio strips "sqlite://" and the third slash goes with
# it, so an absolute path needs one more.
modparam("presence", "db_url", "sqlite:////var/lib/kamailio/presence.db")

# ----- ims_usrloc_scscf: the registrar store -----
# Memory only, like the old proxy. This holds IMPU bindings and the user
# profile the HSS returns, not plain SIP AoRs.
modparam("ims_usrloc_scscf", "db_mode", 0)
modparam("ims_usrloc_scscf", "matching_mode", 0)
modparam("ims_usrloc_scscf", "maxcontact", 5)
modparam("ims_usrloc_scscf", "maxcontact_behaviour", 2)

# ----- ims_registrar_scscf: REGISTER handling and SAR -----
modparam("ims_registrar_scscf", "scscf_name", SCSCF_URI)
modparam("ims_registrar_scscf", "cxdx_dest_realm", HSS_REALM)
modparam("ims_registrar_scscf", "user_data_xsd", "/etc/kamailio/CxDataType_Rel7.xsd")
modparam("ims_registrar_scscf", "default_expires", 3600)
modparam("ims_registrar_scscf", "min_expires", 60)
modparam("ims_registrar_scscf", "max_expires", 3600)
modparam("ims_registrar_scscf", "max_contacts", 5)
modparam("ims_registrar_scscf", "use_path", 1)
modparam("ims_registrar_scscf", "user_data_always", 1)

# ----- ims_auth: IMS AKA and MAR -----
modparam("ims_auth", "name", SCSCF_URI)
modparam("ims_auth", "cxdx_dest_realm", HSS_REALM)
# AKAv1-MD5 is what a UE with a real SIM does, and what SIPp implements.
modparam("ims_auth", "registration_default_algorithm", "AKAv1-MD5")
modparam("ims_auth", "av_check_only_impu", 1)
modparam("ims_auth", "av_request_at_once", 1)
modparam("ims_auth", "av_request_at_sync", 1)
modparam("ims_auth", "registration_qop", "auth")
modparam("ims_auth", "auth_vector_timeout", 60)

####### Routing Logic #########

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "[SCSCF] malformed request from $si:$sp\n");
        exit;
    }

    xlog("L_INFO", "[SCSCF] $rm from $si:$sp -> $ru\n");

    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
        } else if (is_method("ACK")) {
            exit;
        } else {
            sl_send_reply("404", "Not Here");
        }
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }
    t_check_trans();

    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    if (is_method("INVITE|MESSAGE|OPTIONS|INFO")) {
        route(STRIP_OWN_ROUTE);
        if (is_method("INVITE")) {
            record_route();
        }
        route(LOOKUP);
        route(RELAY);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

# --- Registration: challenge, verify, then tell the HSS ---
route[REGISTER] {
    xlog("L_INFO", "[SCSCF] REGISTER for $tu (algorithm $aa)\n");

    if (!ims_www_authenticate("$td")) {
        if ($? == -2) {
            xlog("L_ERR", "[SCSCF] authentication failed for $tu\n");
            send_reply("403", "Authentication Failed");
            exit;
        } else if ($? == -3) {
            send_reply("400", "Bad Request");
            exit;
        } else if ($? == -9) {
            # The UE reported an out-of-range SQN and sent AUTS. Ask the HSS
            # for a resynchronised vector rather than failing the register --
            # the two SQN counters drift apart easily in a lab.
            xlog("L_INFO", "[SCSCF] AKA re-sync requested by $tu\n");
            ims_www_resync_auth("REG_RESYNC_REPLY", "$td");
            exit;
        } else {
            # First REGISTER of the pair: no credentials yet, so fetch
            # vectors from the HSS (MAR) and answer 401 with the challenge.
            xlog("L_INFO", "[SCSCF] challenging $tu -- MAR to the HSS\n");
            ims_www_challenge("REG_MAR_REPLY", "$td", "AKAv1-MD5");
            exit;
        }
    }

    xlog("L_INFO", "[SCSCF] $tu authenticated\n");
    if (!impu_registered("location")) {
        save("PRE_REG_SAR_REPLY", "location");
    } else {
        save("REG_SAR_REPLY", "location");
    }
    exit;
}

# MAR and SAR are asynchronous: the module returns immediately and calls
# these routes when the answer arrives, with the result in an AVP.
route[REG_MAR_REPLY] {
    switch ($avp(s:maa_return_code)) {
        case 1:
            xlog("L_INFO", "[SCSCF] MAA ok -- 401 challenge sent\n");
            break;
        case -1:
            xlog("L_ERR", "[SCSCF] MAA failure -- error response sent\n");
            break;
        default:
            xlog("L_ERR", "[SCSCF] MAA unexpected code [$avp(s:maa_return_code)]\n");
            send_reply("500", "MAR failed");
            break;
    }
    exit;
}

route[PRE_REG_SAR_REPLY] {
    switch ($avp(s:saa_return_code)) {
        case 1:
            xlog("L_INFO", "[SCSCF] SAA ok -- $tu is registered\n");
            break;
        default:
            xlog("L_ERR", "[SCSCF] SAA failed [$avp(s:saa_return_code)]\n");
            send_reply("500", "SAR failed");
            break;
    }
    exit;
}

route[REG_SAR_REPLY] {
    switch ($avp(s:saa_return_code)) {
        case 1:
            xlog("L_INFO", "[SCSCF] SAA ok -- $tu re-registered\n");
            break;
        default:
            xlog("L_ERR", "[SCSCF] SAA failed [$avp(s:saa_return_code)]\n");
            send_reply("500", "SAR failed");
            break;
    }
    exit;
}

route[REG_RESYNC_REPLY] {
    xlog("L_INFO", "[SCSCF] re-sync answer [$avp(s:maa_return_code)]\n");
    exit;
}

# --- Remove the Route the I-CSCF puts in front of a terminating request ---
#
# ims_icscf writes the Server-Name the HSS returned as a Route header, and it
# writes it WITHOUT ";lr". That makes it a strict-router route, so it must be
# taken off here by hand:
#
#   * loose_route() does not consume it. It recognises the URI as ours, then
#     applies RFC 3261 strict-routing and rewrites the R-URI to it -- which
#     replaces the callee's IMPU with our own address, and lookup() then has
#     nothing to resolve.
#   * left in place, it is copied into the request we forward. The P-CSCF
#     downstream applies the same strict-routing rule, sends the INVITE back
#     to us with the R-URI destroyed, and the call ends in 404.
#
# remove_hf_value() rather than remove_hf(), because the latter would delete
# every Route header and a request may legitimately carry others.
route[STRIP_OWN_ROUTE] {
    if (!is_present_hf("Route")) {
        return;
    }
    if ($(hdr(Route){nameaddr.uri}) == SCSCF_URI) {
        remove_hf_value("Route[1]");
        xlog("L_INFO", "[SCSCF] removed our own Route, $rm stays for $ru\n");
    }
}

route[LOOKUP] {
    # ims_registrar_scscf exports lookup() too; it resolves an IMPU to the
    # contacts recorded at registration.
    if (!lookup("location")) {
        xlog("L_INFO", "[SCSCF] $rU is not registered\n");
        sl_send_reply("404", "User Not Found");
        exit;
    }
    xlog("L_INFO", "[SCSCF] $rU -> $ru\n");
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

onreply_route {
    xlog("L_INFO", "[SCSCF] reply $rs for $rm from $si\n");
}
