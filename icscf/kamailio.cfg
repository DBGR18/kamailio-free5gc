#!KAMAILIO
#
# I-CSCF -- the Interrogating CSCF.
#
# The network's front door, and the only role that answers "which S-CSCF
# serves this user?". It answers by asking the HSS, which is why it is the
# other half of Cx:
#
#   UAR/UAA   on REGISTER -- assign or look up the serving S-CSCF
#   LIR/LIA   on an incoming call -- find where the callee is registered
#
# It keeps no user state of its own. Everything it knows comes from the HSS
# or from the S-CSCF pool table built into the image.

####### Defined Values #########
#!define ICSCF_IP   "10.100.100.22"
#!define ICSCF_PORT 4060
#!define HSS_REALM  "ims.mnc093.mcc208.3gppnetwork.org"

####### Global Parameters #########
debug=2
log_stderror=yes
log_facility=LOG_LOCAL0

children=4
listen=udp:ICSCF_IP:ICSCF_PORT
disable_tcp=yes

####### Modules #########
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"

loadmodule "db_sqlite.so"
loadmodule "cdp.so"
loadmodule "cdp_avp.so"
loadmodule "ims_icscf.so"

####### Module parameters #########
modparam("cdp", "config_file", "/etc/kamailio/icscf.xml")

# The S-CSCF pool lives in a database so the set can change without a
# restart. Four slashes: kamailio strips "sqlite://" and the third slash
# goes with it, so an absolute path needs one more.
modparam("ims_icscf", "db_url", "sqlite:////var/lib/kamailio/icscf.db")
modparam("ims_icscf", "cxdx_dest_realm", HSS_REALM)

####### Routing Logic #########

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "[ICSCF] malformed request from $si:$sp\n");
        exit;
    }

    xlog("L_INFO", "[ICSCF] $rm from $si:$sp -> $ru\n");

    # In-dialog requests already carry the route set built at INVITE time.
    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
        } else if (is_method("ACK")) {
            exit;
        } else {
            sl_send_reply("404", "Not Here");
        }
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }
    t_check_trans();

    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    route(TERMINATING);
    exit;
}

# --- REGISTER: ask the HSS which S-CSCF should serve this user ---
route[REGISTER] {
    t_set_fr(10000, 10000);

    # A previous UAR in this transaction may already have produced a list --
    # a re-REGISTER answering a 401 is the common case, and skipping the
    # second UAR is what the S-CSCF list is kept for.
    if (I_scscf_select("0")) {
        xlog("L_INFO", "[ICSCF] S-CSCF already selected for $tu\n");
        route(RELAY_TO_SCSCF);
        exit;
    }

    I_scscf_drop();
    xlog("L_INFO", "[ICSCF] UAR to the HSS for $tu\n");
    # "0" means a plain REGISTER/de-REGISTER rather than one asking the HSS
    # to return S-CSCF capabilities.
    if (!I_perform_user_authorization_request("REG_UAR_REPLY", "0")) {
        send_reply("500", "Error in Request");
    }
    exit;
}

route[REG_UAR_REPLY] {
    switch ($avp(s:uaa_return_code)) {
        case 1:
            if (I_scscf_select("0")) {
                xlog("L_INFO", "[ICSCF] UAA ok -- forwarding to $ru\n");
                route(RELAY_TO_SCSCF);
            } else {
                I_scscf_drop();
                xlog("L_ERR", "[ICSCF] UAA ok but no S-CSCF matched\n");
                t_reply("500", "No S-CSCF available");
            }
            break;
        case -1:
            xlog("L_ERR", "[ICSCF] UAA failure -- error response sent\n");
            break;
        default:
            xlog("L_ERR", "[ICSCF] UAA code [$avp(s:uaa_return_code)]\n");
            t_reply("500", "UAR failed");
            break;
    }
    exit;
}

# --- Terminating requests: ask the HSS where the callee is registered ---
route[TERMINATING] {
    t_set_fr(10000, 10000);
    xlog("L_INFO", "[ICSCF] LIR to the HSS for $ru\n");
    if (!I_perform_location_information_request("LIR_REPLY", "0")) {
        send_reply("500", "Error in Request");
    }
    exit;
}

route[LIR_REPLY] {
    switch ($avp(s:lia_return_code)) {
        case 1:
            # The Server-Name the HSS returned goes into the same S-CSCF list
            # a UAA fills, and it takes an explicit select() to move it into
            # the request's destination. Without that the R-URI is used as-is
            # and the I-CSCF tries to resolve the IMS realm in DNS -- a name
            # no resolver here knows, so the call dies as 478 Unresolvable.
            if (I_scscf_select("0")) {
                xlog("L_INFO", "[ICSCF] LIA ok -- $ru to the S-CSCF at $du\n");
                route(RELAY);
            } else {
                I_scscf_drop();
                xlog("L_ERR", "[ICSCF] LIA ok but the S-CSCF list was empty\n");
                t_reply("500", "No S-CSCF for the callee");
            }
            break;
        case -1:
            xlog("L_ERR", "[ICSCF] LIA failure -- error response sent\n");
            break;
        default:
            xlog("L_ERR", "[ICSCF] LIA code [$avp(s:lia_return_code)]\n");
            t_reply("500", "LIR failed");
            break;
    }
    exit;
}

route[RELAY_TO_SCSCF] {
    t_on_reply("SCSCF_REPLY");
    if (!t_relay()) {
        send_reply("500", "Error forwarding to the S-CSCF");
    }
    exit;
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

onreply_route[SCSCF_REPLY] {
    # Keep the S-CSCF list across a 401 so the re-REGISTER skips its UAR;
    # drop it on anything else so a later attempt starts clean.
    if (!t_check_status("(408)|(480)")) {
        if (!t_check_status("(401)")) {
            I_scscf_drop();
        }
    }
    break;
}

onreply_route {
    xlog("L_INFO", "[ICSCF] reply $rs for $rm from $si\n");
}
