# Open5GS HSS -- the IMS identity source.
#
# This is deliberately NOT connected to free5gc's MongoDB. The HSS and the
# UDR store different worlds: the UDR holds SUPI / K / OPc / slice data for
# 5G access, the HSS holds IMPI / IMPU / iFC for IMS. 3GPP defines no
# interface between them and IMS authentication never reads the UDR, so the
# HSS gets its own database on the IMS side of the topology.
#
# The two are related by a naming rule rather than a data path: with no ISIM
# on the UE, the IMPI is derived from the IMSI per TS 23.003 section 13.4B,
# so both stores are provisioned from the same list of IMSIs.
# NOTE: the gradiant/open5gs image sets DB_URI in the environment, and that
# takes precedence over this value. docker-compose.yaml overrides it there;
# this line is the documented default, not the effective one.
db_uri: mongodb://hss-db/open5gs

logger:
  level: info # fatal|error|warn|info(default)|debug|trace

global:

hss:
  freeDiameter: /open5gs/hss.conf
