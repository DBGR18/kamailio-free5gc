# freeDiameter configuration for the HSS.
#
# The Cx interface lives here: the I-CSCF and S-CSCF connect as Diameter
# peers and issue UAR / MAR / SAR / LIR. Open5GS's HSS implements all four
# (src/hss/hss-cx-path.c), which is the whole set those two roles need.
#
# The realm follows the 3GPP naming rule for PLMN 208/93, so it matches the
# IMPI the UE derives from its IMSI (TS 23.003 section 13.4B):
#   IMSI 208930000000001
#     -> IMPI 208930000000001@ims.mnc093.mcc208.3gppnetwork.org
# The HSS splits that at the "@" and looks the subscriber up by IMSI.

Identity = "hss.ims.mnc093.mcc208.3gppnetwork.org";
Realm = "ims.mnc093.mcc208.3gppnetwork.org";

# Diameter over TCP on the standard port. SCTP is disabled because this PoC
# has a single HSS and no multihoming to gain from it.
Port = 3868;
SecPort = 5868;
No_SCTP;
ListenOn = "0.0.0.0";

# freeDiameter refuses to start without TLS credentials even when every peer
# connects over plain TCP ("Missing private key configuration for TLS"), and
# it checks that the certificate's owner matches Identity above. The image's
# own certificate is issued to "hss.gradiant", so entrypoint.sh generates a
# self-signed one for our 3GPP identity before starting the daemon.
TLS_Cred = "/tmp/hss-tls/hss.cert.pem", "/tmp/hss-tls/hss.key.pem";
TLS_CA = "/tmp/hss-tls/hss.cert.pem";

LoadExtension = "/opt/open5gs/lib/freeDiameter/dbg_msg_dumps.fdx" : "0x8888";
LoadExtension = "/opt/open5gs/lib/freeDiameter/dict_rfc5777.fdx";
LoadExtension = "/opt/open5gs/lib/freeDiameter/dict_mip6i.fdx";
LoadExtension = "/opt/open5gs/lib/freeDiameter/dict_nasreq.fdx";
LoadExtension = "/opt/open5gs/lib/freeDiameter/dict_nas_mipv6.fdx";
LoadExtension = "/opt/open5gs/lib/freeDiameter/dict_dcca.fdx";
LoadExtension = "/opt/open5gs/lib/freeDiameter/dict_dcca_3gpp.fdx";

# No ConnectPeer entries yet: the CSCFs do not exist as separate roles until
# the next step. freeDiameter still accepts incoming connections from any
# peer that presents a matching realm, so this HSS is reachable and testable
# on its own.
