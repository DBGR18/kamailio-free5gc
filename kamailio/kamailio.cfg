#!KAMAILIO
#
# Minimal SIP registrar + proxy for the free5gc PoC.
#
# Role in the architecture: this stands in for the IMS core (P-CSCF/S-CSCF).
# It sits on the Data Network side of the UPF, so every SIP message it sees
# has travelled: UE -> gNB -> (GTP-U/N3) -> UPF -> (N6) -> here.
#
# Deliberately simplified for a PoC -- see docs/ARCHITECTURE.md:
#   * no authentication (a real IMS does SIP digest / IMS-AKA)
#   * location records are kept in memory only (no database)
#   * no Rx/N5 interface towards the PCF (no dedicated QoS bearer)

####### Defined Values #########
#!define DN_IP "10.100.100.10"
#!define UE_SUBNET "10.62.0.0/16"   # the ims DNN pool

####### Global Parameters #########
debug=2
log_stderror=yes
log_facility=LOG_LOCAL0

children=4
listen=udp:DN_IP:5060

# Keep it to UDP: this PoC only needs one transport and it keeps the traces
# readable in tcpdump.
disable_tcp=yes

####### Modules Section ########
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"

# ----- usrloc: memory-only location table -----
# db_mode 0 = keep bindings in RAM. Restarting Kamailio forgets every
# registration, which is fine for a PoC and removes the database dependency.
modparam("usrloc", "db_mode", 0)

# ----- registrar -----
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_contacts", 10)

# ----- rr: record-route so we stay in the signalling path -----
modparam("rr", "append_fromtag", 0)

####### Routing Logic ########

request_route {
    # Sanity / loop protection
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "[$rm] malformed request from $si:$sp\n");
        exit;
    }

    xlog("L_INFO", "[SIP] $rm from $si:$sp -> $ru\n");

    # In-dialog requests (ACK, BYE, re-INVITE) follow the Route header
    # we inserted with record_route() when the dialog was created.
    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
        } else if (is_method("ACK")) {
            # ACK for a locally generated reply -- absorb it.
            exit;
        } else {
            sl_send_reply("404", "Not Here");
        }
        exit;
    }

    # CANCEL matches the pending transaction
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }
    t_check_trans();

    # --- REGISTER: act as the registrar (this is the "IMS registration") ---
    if (is_method("REGISTER")) {
        if (!save("location")) {
            sl_reply_error();
        }
        xlog("L_INFO", "[REG] $fU bound to $si:$sp\n");
        exit;
    }

    # --- Everything else must be addressed to a user we know about ---
    if (is_method("INVITE|MESSAGE|OPTIONS|INFO")) {
        # Stay in the path for the whole dialog so that BYE reaches us too.
        if (is_method("INVITE")) {
            record_route();
        }
        route(LOOKUP);
        route(RELAY);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

# Translate the request URI into the contact the UE registered with.
route[LOOKUP] {
    if (!lookup("location")) {
        $var(rc) = $rc;
        if ($var(rc) == -1 || $var(rc) == -3) {
            xlog("L_INFO", "[LOOKUP] $rU is not registered\n");
            sl_send_reply("404", "User Not Found");
        } else if ($var(rc) == -2) {
            sl_send_reply("405", "Method Not Allowed");
        }
        exit;
    }
    xlog("L_INFO", "[LOOKUP] $rU -> $ru\n");
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# Log the replies flowing back so the PoC transcript shows both directions.
onreply_route {
    xlog("L_INFO", "[SIP] reply $rs $rr for $rm from $si\n");
}
