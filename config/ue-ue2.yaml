# free-ran-ue UE 2.
#
# The keys must match what scripts/02-add-subscribers.sh writes into the UDR
# for imsi-208930000000002; they are free5gc's standard test values.
#
# NOTE: free-ran-ue supports exactly ONE PDU session per UE
# (constant.PDU_SESSION_ID is a single constant), so "dnn" below is the only
# data network this UE can reach.
ue:
  ranControlPlaneIp: "10.100.200.40" # poc-gnb
  ranDataPlaneIp: "10.100.200.40"    # poc-gnb

  ranControlPlanePort: 31413
  ranDataPlanePort: 31414

  plmnId:
    mcc: "208"
    mnc: "93"
  msin: "0000000002"

  authenticationSubscription:
    encPermanentKey: "8baf473f2f8fd09487cccbd7097c6862"
    # OPc, computed from OP cdc202d5123e20f62b6d676ac72cb318 by scripts/lib-keys.sh.
    # SIPp needs the OP and cannot take an OPc, so OP is the source of
    # truth and this value is derived; 01-up.sh checks the two agree.
    encOpcKey: "604de903e29f45ef46ddbca70565fcfb"
    authenticationManagementField: "8000"
    # SEQ must sit exactly one step ahead of the UE's counter; see
    # docs/ARCHITECTURE.md for why 0 and the template default both fail.
    sequenceNumber: "000000000023"

  integrityAlgorithm:
    nia0: false
    nia1: false
    nia2: true
    nia3: false
  cipheringAlgorithm:
    nea0: true
    nea1: false
    nea2: false
    nea3: false

  pduSession:
    dnn: "ims"
    snssai:
      sst: "1"
      sd: "010203"

  accessType: "3GPP_ACCESS"

  nrdc:
    enable: false

  ueTunnelDevice: "ueTun"
  ignoreSetupTunnel: false

logger:
  level: "info"
