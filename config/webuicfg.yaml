info:
  version: 1.0.3
  description: WebUI initial local configuration

configuration:
  mongodb: # the mongodb connected by this webui
    name: free5gc # name of the mongodb
    url: mongodb://db:27017 # a valid URL of the mongodb
  nrfUri: http://nrf.free5gc.org:8000 # a valid URI of NRF
  nrfCertPem: cert/nrf.pem
  webServer:
    scheme: http
    ipv4Address: 0.0.0.0
    port: 5000
  billingServer:
    # This whole block is mandatory even though the PoC has no CHF: the webui
    # config validator marks BillingServer as required, and govalidator's
    # "required" on a bool rejects false -- so enable cannot be set to false.
    # The server binds a local port and nothing talks to it; that is harmless.
    enable: true
    hostIPv4: webui
    listenPort: 2121
    portRange: # passive port range
      start: 2123
      end: 2130
    basePath: /tmp/webconsole
    port: 2122

logger: # log output setting
  enable: true # true or false
  level: info # how detailed to output, value: trace, debug, info, warn, error, fatal, panic
  reportCaller: false # enable the caller report or not, value: true or false
